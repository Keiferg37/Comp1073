<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>The Pizza Maker | COMP1073</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link the stylesheet and script (defer waits until HTML is parsed) -->
    <link href="css/styles.css" rel="stylesheet" />
    <script src="js/pizza.js" defer></script>
</head>

<body>
    <header>
        <h1>The Pizza Maker</h1>
        <!-- Student Info -->
        <p id="student-info">Keifer Grainger - 200488755</p>
    </header>

    <main>
        <!-- Pizza order form. novalidate lets our JS control the messages -->
        <form id="pizza-form" novalidate>
            <!-- Customer name -->
            <label for="customer">Your Name</label>
            <input type="text" id="customer" name="customer" required />

            <!-- Size (radio buttons) -->
            <fieldset>
                <legend>Size</legend>
                <label><input type="radio" name="size" value="Small" required /> Small</label>
                <label><input type="radio" name="size" value="Medium" /> Medium</label>
                <label><input type="radio" name="size" value="Large" /> Large</label>
            </fieldset>

            <!-- Crust (dropdown) -->
            <label for="crust">Crust</label>
            <select id="crust" name="crust" required>
                <option value="">-- Choose a crust --</option>
                <option value="Thin">Thin</option>
                <option value="Thick">Thick</option>
                <option value="Stuffed">Stuffed</option>
                <option value="Gluten-Free">Gluten-Free</option>
            </select>

        </form>
    </main>
</body>
</html>
