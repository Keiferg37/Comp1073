<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Claude AI API Integration | COMP1073 Client-Side JavaScript</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link href="css/normalize.css" rel="stylesheet" />
	<link href="css/styles.css" rel="stylesheet" />
	<script src="js/claude-api.js" defer></script>
</head>

<body>
	<h1>Claude AI API Integration - Keifer Grainger and Matthew Zarcone</h1>

	<form>
		<label for="user-message">Your Message:</label>
		<textarea id="user-message" placeholder="Type your message to Claude..." rows="4"></textarea>
		<button type="button" id="send-message">Send Message</button>
		<button type="button" id="check-usage">Check Usage</button>
	</form>

	<!-- Conversation output appears here -->
	<section id="results"></section>

	<!-- Follow-up section: hidden until Claude's first reply arrives -->
	<section id="followup-section" class="hidden">
		<label for="followup-message">Continue the conversation:</label>
		<textarea id="followup-message" placeholder="Ask a follow-up..." rows="4"></textarea>
		<button type="button" id="send-followup">Send Follow-up</button>
	</section>

	<!-- Proceed to js/claude-api.js for the remainder of the lesson -->
</body>
</html>
